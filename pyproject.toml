[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk"
version = "0.5.11"
description = "SDK for building A2A/AG-UI/A2UI agents with an OAuth-protected MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Lower-bound-only constraints by policy (DESIGN.md §10.3): consuming templates own exact pins.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "cryptography>=42.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
azure = ["azure-data-tables>=12.5", "azure-identity>=1.15"]
obo = ["msal>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_sdk"]
# Console assets and example skills ship inside the wheel (DESIGN.md §7, §12).
artifacts = [
    "agent_sdk/console/templates/*",
    "agent_sdk/console/static/*",
    "agent_sdk/example/skills/**/*",
    "agent_sdk/example/artifacts/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
ignore_missing_imports = true
strict = false
# Zero-tolerance: any new error is a release blocker.
# Run: mypy agent_sdk/ --ignore-missing-imports
