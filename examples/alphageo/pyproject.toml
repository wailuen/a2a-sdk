[project]
name = "alphageo-agent"
version = "0.1.0"
description = "AlphaGeo climate-risk analyst (A2A / AG-UI / A2UI / MCP) built on agent-sdk"
requires-python = ">=3.11"
dependencies = [
    "agent-sdk",
    "openai>=1.40",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
